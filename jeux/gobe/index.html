<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gobe-têtes</title>
</head>
<body>
<script type="module">
import {runGame,FW,FH,clamp,text,drawCover,loadFirst,withExts,initials} from "../../shared/engine.js";

/* Photos : jeux/photos/equipe/<slug>.jpg (sinon top10/photos/<slug>.jpg), jeux/photos/rivaux/<slug>.jpg */
const AMIS=[["thibaut-pinot","Thibaut Pinot"],["arnaud-demare","Arnaud Démare"],["frederic-guesdon","Frédéric Guesdon"],["philippe-gilbert","Philippe Gilbert"],["bradley-mcgee","Bradley McGee"],["baden-cooke","Baden Cooke"],["david-gaudu","David Gaudu"],["sandy-casar","Sandy Casar"],["stefan-kung","Stefan Küng"],["arthur-vichot","Arthur Vichot"]];
/* Rivaux : anciens de la maison, noms qui ressemblent à ceux de l'équipe, et quelques stars pour brouiller les pistes */
const RIVAUX=[["guillaume-martin","Guillaume Martin"],["olivier-le-gac","Olivier Le Gac"],["nacer-bouhanni","Nacer Bouhanni"],["bradley-wiggins","Bradley Wiggins"],["alexandre-geniez","Alexandre Geniez"],["jake-stewart","Jake Stewart"],
["arnaud-de-lie","Arnaud De Lie"],["thibau-nys","Thibau Nys"],["stefan-bissegger","Stefan Bissegger"],["sandy-dujardin","Sandy Dujardin"],["valentin-ferron","Valentin Ferron"],["david-de-la-cruz","David de la Cruz"],["frederik-frison","Frederik Frison"],["brandon-mcnulty","Brandon McNulty"],["phil-bauhaus","Phil Bauhaus"],
["tadej-pogacar","Tadej Pogačar"],["jonas-vingegaard","Jonas Vingegaard"],["remco-evenepoel","Remco Evenepoel"],["mathieu-van-der-poel","Mathieu van der Poel"],["julian-alaphilippe","Julian Alaphilippe"]];
const mk=(list,kind,bases)=>list.map(([slug,name])=>{
  const c={slug,name,kind,img:null,ini:initials(name)};
  loadFirst(bases.flatMap(b=>withExts(b+slug,["jpg","png","webp"]))).then(im=>{c.img=im;});
  return c;
});
const CARDS={ami:mk(AMIS,"ami",["../photos/equipe/","../../top10/photos/"]),rival:mk(RIVAUX,"rival",["../photos/rivaux/"])};

const DURATION=45,R=62;
const S={t:0,time:DURATION,score:0,streak:0,items:[],spawn:0,pops:[],over:false,shake:0,gobbed:0,beurk:0,missed:0,phase:"count",count:3,last:null};

function start(){
  Object.assign(S,{t:0,time:DURATION,score:0,streak:0,items:[],spawn:.6,pops:[],over:false,shake:0,gobbed:0,beurk:0,missed:0,phase:"count",count:3,last:null});
}
function spawn(d){
  const kind=Math.random()<.55?"ami":"rival",list=CARDS[kind];
  let c;do{c=list[Math.floor(Math.random()*list.length)];}while(c===S.last&&list.length>1);
  S.last=c;
  S.items.push({c,x:90+Math.random()*(FW-180),y:-R,vy:290+250*d+Math.random()*60,vx:(Math.random()-.5)*50,rot:(Math.random()-.5)*.6,vr:(Math.random()-.5)*1.4,eat:0,ex:0,ey:0});
}
function pop(x,y,t,color){S.pops.push({x,y,t,color,age:0});}
function update(dt,input,api){
  S.shake=Math.max(0,S.shake-dt);
  for(const p of S.pops)p.age+=dt;
  S.pops=S.pops.filter(p=>p.age<1);
  if(S.over)return;
  if(S.phase==="count"){if(input.ok){S.count-=dt;if(S.count<=0)S.phase="play";}return;}
  if(S.phase!=="play"||!input.ok)return;

  /* bouche : visage ou doigt */
  let mx=FW/2,my=FH*.62,open=false,jaw=0;
  if(api.useFace&&input.faces[0]){const f=input.faces[0];mx=f.mouth.x;my=f.mouth.y;jaw=f.jaw;open=jaw>.3;}
  else if(input.pointer){mx=input.pointer.x;my=input.pointer.y;open=input.pointer.down;jaw=open?1:.1;}
  S.mouth={x:mx,y:my,open,jaw};

  S.t+=dt;S.time=Math.max(0,DURATION-S.t);
  const d=clamp(S.t/DURATION,0,1);
  S.spawn-=dt;
  if(S.spawn<=0){spawn(d);S.spawn=1.0-.5*d;}
  const reach=58+62*clamp(jaw,0,1);
  for(const it of S.items){
    if(it.eat>0){it.eat+=dt*6;continue;}
    it.x+=it.vx*dt;it.y+=it.vy*dt;it.rot+=it.vr*dt;
    if(it.x<R||it.x>FW-R)it.vx*=-1;
    if(open&&Math.hypot(it.x-mx,it.y-my)<reach+R*.55){
      it.eat=.001;it.ex=it.x;it.ey=it.y;
      if(it.c.kind==="ami"){
        S.gobbed++;S.streak++;
        const m=Math.min(5,1+Math.floor((S.streak-1)/3)),pts=10*m;
        S.score+=pts;pop(it.x,it.y-40,"+"+pts+(m>1?"  ×"+m:""),"#7CFF9E");
      }else{
        S.beurk++;S.streak=0;S.score=Math.max(0,S.score-20);S.shake=.45;
        pop(it.x,it.y-40,"BEURK −20","#FF6B6B");
      }
    }
  }
  S.items=S.items.filter(it=>{
    if(it.eat>1)return false;
    if(it.eat===0&&it.y>FH+R){if(it.c.kind==="ami"){S.missed++;S.streak=0;}return false;}
    return true;
  });
  if(S.time<=0){S.over=true;S.items=[];}
}
function head(c,it,api){
  const k=it.c,sc=it.eat>0?Math.max(0,1-it.eat):1,x=it.eat>0?it.ex+((S.mouth?S.mouth.x:it.ex)-it.ex)*clamp(it.eat,0,1):it.x,y=it.eat>0?it.ey+((S.mouth?S.mouth.y:it.ey)-it.ey)*clamp(it.eat,0,1):it.y;
  c.save();c.translate(x,y);c.rotate(it.rot);c.scale(sc,sc);
  c.shadowColor="rgba(0,0,0,.45)";c.shadowBlur=18;c.shadowOffsetY=8;
  c.beginPath();c.arc(0,0,R,0,7);c.fillStyle="#2A1A7A";c.fill();c.shadowColor="transparent";
  c.save();c.beginPath();c.arc(0,0,R,0,7);c.clip();
  if(k.img)drawCover(c,k.img,-R,-R,R*2,R*2);
  else{
    const g=c.createLinearGradient(-R,-R,R,R);g.addColorStop(0,"#3A2A9A");g.addColorStop(1,"#17113F");
    c.fillStyle=g;c.fillRect(-R,-R,R*2,R*2);
    c.fillStyle="rgba(255,255,255,.22)";c.beginPath();c.arc(0,-8,R*.34,0,7);c.fill();c.beginPath();c.ellipse(0,R*.62,R*.62,R*.4,0,0,7);c.fill();
    text(c,k.ini,0,6,R*.7,{stroke:false,alpha:.95});
  }
  c.restore();
  c.lineWidth=3;c.strokeStyle="rgba(255,255,255,.9)";c.beginPath();c.arc(0,0,R+2,0,7);c.stroke();
  c.restore();
  if(it.eat===0)text(c,k.name,x,y+R+22,26,{maxw:230});
}
function draw(c,api,input){
  const sh=S.shake>0?(Math.random()-.5)*18*S.shake/.45:0;
  c.save();c.translate(sh,sh*.6);
  c.fillStyle="rgba(8,12,44,.22)";c.fillRect(-20,-20,FW+40,FH+40);
  for(const it of S.items)head(c,it,api);
  if(S.mouth&&S.phase==="play"&&!S.over){
    const m=S.mouth;
    c.save();c.lineWidth=6;c.strokeStyle=m.open?"#7CFF9E":"rgba(255,255,255,.55)";c.setLineDash(m.open?[]:[10,10]);
    c.beginPath();c.arc(m.x,m.y,58+62*clamp(m.jaw,0,1),0,7);c.stroke();c.restore();
  }
  for(const p of S.pops){text(c,p.text||p.t,p.x,p.y-p.age*90,54,{color:p.color,alpha:1-p.age});}
  /* HUD */
  text(c,String(Math.ceil(S.time)),52,66,86,{align:"left"});
  text(c,"SCORE",FW-40,40,26,{align:"right",alpha:.85});
  text(c,String(S.score),FW-40,92,76,{align:"right"});
  if(S.streak>=3)text(c,"SÉRIE ×"+Math.min(5,1+Math.floor((S.streak-1)/3)),FW/2,66,42,{color:"#FFD84D"});
  if(S.phase==="count"){
    text(c,String(Math.max(1,Math.ceil(S.count))),FW/2,FH/2-150,230,{alpha:.95});
    text(c,"GOBE L'ÉQUIPE, PAS LES AUTRES",FW/2,FH/2+10,46,{maxw:FW-60});
    text(c,"BOUCHE OUVERTE = TU AVALES",FW/2,FH/2+64,34,{alpha:.85,maxw:FW-60});
  }
  if(S.over){
    c.fillStyle="rgba(8,12,44,.7)";c.fillRect(0,FH/2-210,FW,430);
    const v=S.score>=300?"GLOUTON DE LÉGENDE":S.score>=180?"GRAND GOURMAND":S.score>=80?"APPÉTIT CORRECT":"À JEUN";
    text(c,v,FW/2,FH/2-130,86,{maxw:FW-50});
    text(c,S.score+" POINTS",FW/2,FH/2-30,110,{color:"#FFD84D"});
    text(c,S.gobbed+" coureurs gobés",FW/2,FH/2+60,40,{alpha:.9});
    text(c,S.beurk+" intrus avalés · "+S.missed+" ratés",FW/2,FH/2+110,34,{alpha:.85,maxw:FW-60});
  }
  c.restore();
}
window.__gobe={S};
runGame({
  id:"gobe",title:"Gobe-têtes",
  intro:"Des têtes de coureurs de l'équipe tombent du ciel : ouvre la bouche pour les gober. Attention aux intrus : anciens de la maison, noms qui se ressemblent, autres équipes. Dans le doute, ferme la bouche. 45 secondes.",
  game:{start,update,draw,isOver:()=>S.over,hint:()=>""}
});
</script>
</body>
</html>
